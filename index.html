<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>体重管理</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <h1>体重管理</h1>

    <section class="input-section">

      <h2 id="todayDate"></h2>

      <div class="input-group">
        <label for="weight">体重</label>
        <div class="input-with-unit">
          <input
            type="number"
            id="weight"
            step="0.1"
            inputmode="decimal"
            placeholder="62.4"
          >
          <span>kg</span>
        </div>
      </div>

      <div class="input-group">
        <label for="bmi">BMI</label>
        <input
          type="number"
          id="bmi"
          step="0.1"
          inputmode="decimal"
          placeholder="19.8"
        >
      </div>

      <div class="input-group">
        <label for="bodyFat">体脂肪率</label>
        <div class="input-with-unit">
          <input
            type="number"
            id="bodyFat"
            step="0.1"
            inputmode="decimal"
            placeholder="13.7"
          >
          <span>%</span>
        </div>
      </div>

      <div class="button-area">

        <button id="saveButton" type="button">
          記録する
        </button>

        <button id="missedButton" type="button">
          今日は計測忘れ
        </button>

      </div>

      <p id="message"></p>

    </section>


    <section class="chart-section">

      <h2>グラフ</h2>

      <div class="date-range">

        <div class="date-input">

          <label>開始日</label>

          <div class="date-selects">

            <select id="startYear">
              <option value="">年</option>
            </select>

            <select id="startMonth">
              <option value="">月</option>
            </select>

          </div>

        </div>


        <div class="date-input">

          <label>終了日</label>

          <div class="date-selects">

            <select id="endYear">
              <option value="">年</option>
            </select>

            <select id="endMonth">
              <option value="">月</option>
            </select>

          </div>

        </div>

      </div>


      <button
        id="chartButton"
        type="button"
      >
        グラフを表示
      </button>


      <div class="chart-container">
        <canvas id="weightChart"></canvas>
      </div>

    </section>


    <section class="records-section">

      <h2>記録</h2>

      <div id="recordList">
        読み込み中……
      </div>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script src="script.js"></script>

</body>
</html>
